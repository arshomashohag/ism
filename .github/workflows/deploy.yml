name: Deploy

on:
  push:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        required: true
        type: choice
        options:
          - Apply
          - Destroy
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - production
      reason:
        description: "Reason for this action (shown in approval gate)"
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend

jobs:
  # ── Resolve target environment ──────────────────────────────
  # On push/PR: derives env from branch name.
  # On workflow_dispatch: uses the selected environment input.
  resolve-env:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
      tf_dir: ${{ steps.set.outputs.tf_dir }}
      tf_state_key: ${{ steps.set.outputs.tf_state_key }}
      action: ${{ steps.set.outputs.action }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            ACTION="${{ github.event.inputs.action }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" || \
                  "${{ github.base_ref }}" == "main" ]]; then
            ENV="production"
            ACTION="Apply"
          else
            ENV="development"
            ACTION="Apply"
          fi

          if [[ "$ENV" == "production" ]]; then
            TF_DIR="terraform/environments/production"
          else
            TF_DIR="terraform/environments/dev"
          fi

          echo "env_name=$ENV"         >> "$GITHUB_OUTPUT"
          echo "tf_dir=$TF_DIR"        >> "$GITHUB_OUTPUT"
          echo "tf_state_key=terraform.tfstate" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION"        >> "$GITHUB_OUTPUT"

  # ── Terraform Plan (PR + push + dispatch) ───────────────────
  # On PR:       runs plan, posts output as PR comment, no artifact.
  # On push:     runs plan, uploads tfplan artifact.
  # On dispatch: runs plan (or destroy-plan), uploads artifact.
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.resolve-env.outputs.tf_state_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: terraform validate

      - name: Terraform Plan (Apply)
        id: plan
        if: needs.resolve-env.outputs.action == 'Apply'
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          set -o pipefail
          terraform plan \
            -var="image_tag=${{ github.sha }}" \
            -var="ui_certificate_arn=${{ secrets.UI_CERTIFICATE_ARN }}" \
            -var="api_certificate_arn=${{ secrets.API_CERTIFICATE_ARN }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt

      - name: Terraform Plan (Destroy)
        id: plan-destroy
        if: needs.resolve-env.outputs.action == 'Destroy'
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          set -o pipefail
          terraform plan \
            -destroy \
            -var="image_tag=${{ github.sha }}" \
            -var="ui_certificate_arn=${{ secrets.UI_CERTIFICATE_ARN }}" \
            -var="api_certificate_arn=${{ secrets.API_CERTIFICATE_ARN }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt

      - name: Upload tfplan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            ${{ needs.resolve-env.outputs.tf_dir }}/tfplan
            ${{ needs.resolve-env.outputs.tf_dir }}/plan_output.txt
          retention-days: 1

  # ── Resolve approval environment name ───────────────────────
  resolve-approval-env:
    name: Resolve Approval Environment
    runs-on: ubuntu-latest
    outputs:
      approval_env: ${{ steps.set.outputs.approval_env }}
    steps:
      - id: set
        run: |
          echo "approval_env=deployment-approval" >> "$GITHUB_OUTPUT"

  # ── Await Approval (Apply or Destroy) ───────────────────────
  # Reviewer sees: action, environment, reason, and plan summary
  # in the workflow run UI before approving or rejecting.
  terraform-approve:
    name: >-
      Await Approval —
      ${{ needs.resolve-env.outputs.action }}
      [${{ needs.resolve-env.outputs.env_name }}]
    runs-on: ubuntu-latest
    needs: [resolve-env, resolve-approval-env, terraform-plan]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.terraform-plan.result == 'success'
    environment: ${{ needs.resolve-approval-env.outputs.approval_env }}

    steps:
      - name: Show request details
        run: |
          echo "════════════════════════════════════════"
          echo "  ACTION      : ${{ needs.resolve-env.outputs.action }}"
          echo "  ENVIRONMENT : ${{ needs.resolve-env.outputs.env_name }}"
          echo "  REQUESTED BY: ${{ github.actor }}"
          echo "  COMMIT      : ${{ github.sha }}"
          echo "  REASON      : ${{ github.event.inputs.reason || 'Automated push deploy' }}"
          echo "════════════════════════════════════════"
          echo ""
          echo "Review the Terraform plan in the artifact uploaded by the"
          echo "'Terraform Plan' job before approving."

  # ── Terraform Apply ──────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [resolve-env, terraform-approve]
    if: >-
      needs.terraform-approve.result == 'success' &&
      needs.resolve-env.outputs.action == 'Apply'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.resolve-env.outputs.tf_state_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ needs.resolve-env.outputs.tf_dir }}

      - name: Terraform Apply
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: terraform apply -auto-approve tfplan

  # ── Terraform Destroy ────────────────────────────────────────
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: [resolve-env, terraform-approve]
    if: >-
      needs.terraform-approve.result == 'success' &&
      needs.resolve-env.outputs.action == 'Destroy'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.resolve-env.outputs.tf_state_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ needs.resolve-env.outputs.tf_dir }}

      - name: Terraform Destroy
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: terraform apply -auto-approve tfplan

  # ── Build & Push Backend Image ──────────────────────────────
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [resolve-env, terraform-apply]
    if: >-
      needs.terraform-apply.result == 'success' &&
      needs.resolve-env.outputs.action == 'Apply'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push backend image
        id: build
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            >> "$GITHUB_OUTPUT"

  # ── Run Alembic Migrations ──────────────────────────────────
  run-migrations:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [resolve-env, build-backend]
    if: needs.build-backend.result == 'success'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Alembic migration ECS task
        run: |
          IMAGE_URI=$(aws ecr describe-repositories \
            --repository-names "${{ secrets.ECR_REPOSITORY_NAME }}" \
            --query 'repositories[0].repositoryUri' \
            --output text):${{ github.sha }}
          echo "Image URI: $IMAGE_URI"

          MIGRATION_TASK_DEF="ims-${{ needs.resolve-env.outputs.env_name }}-migration"

          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$MIGRATION_TASK_DEF" \
            --query 'taskDefinition' \
            --output json \
            | jq --arg img "$IMAGE_URI" '
                .containerDefinitions[0].image = $img
                | del(.taskDefinitionArn, .revision, .status,
                      .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy)
              ')

          MIGRATION_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Migration task definition: $MIGRATION_TASK_DEF_ARN"

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --task-definition "$MIGRATION_TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={
              subnets=[${{ secrets.ECS_PRIVATE_SUBNET_IDS }}],
              securityGroups=[${{ secrets.ECS_TASK_SG_ID }}],
              assignPublicIp=DISABLED
            }" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task ARN: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ] || exit 1

  # ── Deploy to ECS ───────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    needs: [resolve-env, build-backend, run-migrations]
    if: needs.run-migrations.result == 'success'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new task definition revision and update service
        run: |
          IMAGE_URI=$(aws ecr describe-repositories \
            --repository-names "${{ secrets.ECR_REPOSITORY_NAME }}" \
            --query 'repositories[0].repositoryUri' \
            --output text):${{ github.sha }}
          echo "Image URI: $IMAGE_URI"

          BACKEND_TASK_DEF="ims-${{ needs.resolve-env.outputs.env_name }}-backend"

          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$BACKEND_TASK_DEF" \
            --query 'taskDefinition' \
            --output json \
            | jq --arg img "$IMAGE_URI" '
                .containerDefinitions[0].image = $img
                | del(.taskDefinitionArn, .revision, .status,
                      .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy)
              ')

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "New task definition: $NEW_TASK_DEF_ARN"

          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --service "${{ secrets.ECS_SERVICE_NAME }}" \
            --task-definition "$NEW_TASK_DEF_ARN"

      - name: Wait for ECS service to stabilise
        timeout-minutes: 20
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --services "${{ secrets.ECS_SERVICE_NAME }}"

  # ── Build & Deploy Flutter Web ──────────────────────────────
  deploy-frontend:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    needs: [resolve-env, terraform-apply]
    if: >-
      needs.terraform-apply.result == 'success' &&
      needs.resolve-env.outputs.action == 'Apply'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: flutter pub get

      - name: Build Flutter web
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          flutter build web \
            --release \
            --base-href / \
            --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Flutter build to S3
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          aws s3 sync build/web/ \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "flutter_service_worker.js" \
            --exclude "manifest.json"

          aws s3 cp build/web/index.html \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp build/web/flutter_service_worker.js \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/flutter_service_worker.js" \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp build/web/manifest.json \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/manifest.json" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  # ── Build & Deploy Flutter macOS Desktop ────────────────────
  deploy-macos:
    name: Build & Deploy macOS Desktop
    runs-on: macos-latest
    needs: [resolve-env, terraform-apply]
    if: >-
      needs.terraform-apply.result == 'success' &&
      needs.resolve-env.outputs.action == 'Apply'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        working-directory: ${{ env.FRONTEND_DIR }}
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: flutter pub get

      - name: Build macOS release
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          flutter build macos \
            --release \
            --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }}

      - name: Zip .app bundle
        working-directory: >-
          ${{ env.FRONTEND_DIR }}/build/macos/Build/Products/Release
        run: |
          APP=$(ls -d *.app | head -1)
          zip -r --symlinks \
            IMS-macOS-${{ github.sha }}.zip \
            "$APP"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload macOS build to S3
        working-directory: >-
          ${{ env.FRONTEND_DIR }}/build/macos/Build/Products/Release
        run: |
          aws s3 cp \
            "IMS-macOS-${{ github.sha }}.zip" \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/downloads/macos/IMS-macOS-${{ github.sha }}.zip" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp \
            "IMS-macOS-${{ github.sha }}.zip" \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/downloads/macos/IMS-macOS-latest.zip" \
            --cache-control "no-cache, no-store, must-revalidate"
