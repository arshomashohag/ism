name: Deploy

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  AWS_REGION: us-east-1
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend

jobs:
  # ── Resolve target environment ──────────────────────────────
  # Sets `env_name` to "production" (main) or "development" (development).
  # Every subsequent job reads jobs.resolve-env.outputs.env_name.
  resolve-env:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
      tf_dir: ${{ steps.set.outputs.tf_dir }}
      tf_state_key: ${{ steps.set.outputs.tf_state_key }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || \
                "${{ github.base_ref }}" == "main" ]]; then
            echo "env_name=production"   >> "$GITHUB_OUTPUT"
            echo "tf_dir=terraform/environments/production" >> "$GITHUB_OUTPUT"
            echo "tf_state_key=terraform.tfstate" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=development"  >> "$GITHUB_OUTPUT"
            echo "tf_dir=terraform/environments/dev" >> "$GITHUB_OUTPUT"
            echo "tf_state_key=terraform.tfstate" >> "$GITHUB_OUTPUT"
          fi

  # ── Terraform Plan (PR + push) ──────────────────────────────
  # On PR:   runs plan, posts output as PR comment, no artifact.
  # On push: runs plan, uploads tfplan artifact for apply job.
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.resolve-env.outputs.tf_state_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          set -o pipefail
          terraform plan \
            -var="image_tag=${{ github.sha }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              '${{ needs.resolve-env.outputs.tf_dir }}/plan_output.txt', 'utf8'
            );
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n...(truncated)'
              : plan;
            const env = '${{ needs.resolve-env.outputs.env_name }}';
            const icon = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ${icon} Terraform Plan (${env})\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Upload tfplan artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            ${{ needs.resolve-env.outputs.tf_dir }}/tfplan
            ${{ needs.resolve-env.outputs.tf_dir }}/plan_output.txt
          retention-days: 1

  # ── Resolve approval environment name ───────────────────────
  # Derives the approval environment name from env_name so that
  # terraform-approve is the only job that references a protected
  # environment with required reviewers.
  resolve-approval-env:
    name: Resolve Approval Environment
    runs-on: ubuntu-latest
    outputs:
      approval_env: ${{ steps.set.outputs.approval_env }}
    steps:
      - id: set
        run: |
          echo "approval_env=deployment-approval" >> "$GITHUB_OUTPUT"

  # ── Await Terraform Apply Approval ──────────────────────────
  terraform-approve:
    name: Await Terraform Apply Approval
    runs-on: ubuntu-latest
    needs: [resolve-approval-env, terraform-plan]
    if: github.event_name == 'push' && needs.terraform-plan.result == 'success'
    environment: ${{ needs.resolve-approval-env.outputs.approval_env }}

    steps:
      - name: Approval granted
        run: echo "Terraform apply approved for ${{ needs.resolve-env.outputs.env_name }}."

  # ── Terraform Apply ──────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [resolve-env, terraform-approve]
    if: github.event_name == 'push' && needs.terraform-approve.result == 'success'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write
    outputs:
      alb_dns_name: ${{ steps.tf-output.outputs.alb_dns_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.resolve-env.outputs.tf_state_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ needs.resolve-env.outputs.tf_dir }}

      - name: Terraform Apply
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf-output
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          echo "alb_dns_name=$(terraform output -raw alb_dns_name)" \
            >> "$GITHUB_OUTPUT"

  # ── Build & Push Backend Image ──────────────────────────────
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [resolve-env, terraform-apply]
    if: github.event_name == 'push' && needs.terraform-apply.result == 'success'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push backend image
        id: build
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            >> "$GITHUB_OUTPUT"

  # ── Run Alembic Migrations ──────────────────────────────────
  run-migrations:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [resolve-env, build-backend]
    if: github.event_name == 'push' && needs.build-backend.result == 'success'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Alembic migration ECS task
        run: |
          IMAGE_URI=$(aws ecr describe-repositories \
            --repository-names "${{ secrets.ECR_REPOSITORY_NAME }}" \
            --query 'repositories[0].repositoryUri' \
            --output text):${{ github.sha }}
          echo "Image URI: $IMAGE_URI"

          MIGRATION_TASK_DEF="ims-${{ needs.resolve-env.outputs.env_name }}-migration"

          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$MIGRATION_TASK_DEF" \
            --query 'taskDefinition' \
            --output json \
            | jq --arg img "$IMAGE_URI" '
                .containerDefinitions[0].image = $img
                | del(.taskDefinitionArn, .revision, .status,
                      .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy)
              ')

          MIGRATION_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Migration task definition: $MIGRATION_TASK_DEF_ARN"

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --task-definition "$MIGRATION_TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={
              subnets=[${{ secrets.ECS_PRIVATE_SUBNET_IDS }}],
              securityGroups=[${{ secrets.ECS_TASK_SG_ID }}],
              assignPublicIp=DISABLED
            }" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task ARN: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ] || exit 1

  # ── Deploy to ECS ───────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    needs: [resolve-env, build-backend, run-migrations]
    if: github.event_name == 'push' && needs.run-migrations.result == 'success'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new task definition revision and update service
        run: |
          IMAGE_URI=$(aws ecr describe-repositories \
            --repository-names "${{ secrets.ECR_REPOSITORY_NAME }}" \
            --query 'repositories[0].repositoryUri' \
            --output text):${{ github.sha }}
          echo "Image URI: $IMAGE_URI"

          BACKEND_TASK_DEF="ims-${{ needs.resolve-env.outputs.env_name }}-backend"

          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$BACKEND_TASK_DEF" \
            --query 'taskDefinition' \
            --output json \
            | jq --arg img "$IMAGE_URI" '
                .containerDefinitions[0].image = $img
                | del(.taskDefinitionArn, .revision, .status,
                      .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy)
              ')

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "New task definition: $NEW_TASK_DEF_ARN"

          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --service "${{ secrets.ECS_SERVICE_NAME }}" \
            --task-definition "$NEW_TASK_DEF_ARN"

      - name: Wait for ECS service to stabilise
        timeout-minutes: 20
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --services "${{ secrets.ECS_SERVICE_NAME }}"

  # ── Build & Deploy Flutter Web ──────────────────────────────
  deploy-frontend:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    needs: [resolve-env, terraform-apply]
    if: github.event_name == 'push' && needs.terraform-apply.result == 'success'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: flutter pub get

      - name: Build Flutter web
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          flutter build web \
            --release \
            --base-href / \
            --dart-define=BACKEND_URL=http://${{ needs.terraform-apply.outputs.alb_dns_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Flutter build to S3
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          aws s3 sync build/web/ \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "flutter_service_worker.js" \
            --exclude "manifest.json"

          aws s3 cp build/web/index.html \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp build/web/flutter_service_worker.js \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/flutter_service_worker.js" \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp build/web/manifest.json \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/manifest.json" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
