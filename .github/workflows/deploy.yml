name: Deploy

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  AWS_REGION: us-east-1
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend

jobs:
  # ── Resolve target environment ──────────────────────────────
  # Sets `env_name` to "production" (main) or "development" (development).
  # Every subsequent job reads jobs.resolve-env.outputs.env_name.
  resolve-env:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
      tf_dir: ${{ steps.set.outputs.tf_dir }}
      tf_state_key: ${{ steps.set.outputs.tf_state_key }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || \
                "${{ github.base_ref }}" == "main" ]]; then
            echo "env_name=production"   >> "$GITHUB_OUTPUT"
            echo "tf_dir=terraform/environments/production" >> "$GITHUB_OUTPUT"
            echo "tf_state_key=terraform.tfstate" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=development"  >> "$GITHUB_OUTPUT"
            echo "tf_dir=terraform/environments/dev" >> "$GITHUB_OUTPUT"
            echo "tf_state_key=terraform.tfstate" >> "$GITHUB_OUTPUT"
          fi

  # ── Terraform Plan (PR + push) ──────────────────────────────
  # On PR:   runs plan, posts output as PR comment, no artifact.
  # On push: runs plan, uploads tfplan artifact for apply job.
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.resolve-env.outputs.tf_state_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          terraform plan \
            -var="image_tag=${{ github.sha }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              '${{ needs.resolve-env.outputs.tf_dir }}/plan_output.txt', 'utf8'
            );
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n...(truncated)'
              : plan;
            const env = '${{ needs.resolve-env.outputs.env_name }}';
            const icon = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ${icon} Terraform Plan (${env})\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Upload tfplan artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            ${{ needs.resolve-env.outputs.tf_dir }}/tfplan
            ${{ needs.resolve-env.outputs.tf_dir }}/plan_output.txt
          retention-days: 1

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ── Await Terraform Apply Approval ──────────────────────────
  terraform-approve:
    name: Await Terraform Apply Approval
    runs-on: ubuntu-latest
    needs: [resolve-env, terraform-plan]
    if: github.event_name == 'push'
    environment: ${{ needs.resolve-env.outputs.env_name }}-approval

    steps:
      - name: Approval granted
        run: echo "Terraform apply approved for ${{ needs.resolve-env.outputs.env_name }}."

  # ── Terraform Apply ──────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [resolve-env, terraform-approve]
    if: github.event_name == 'push'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.resolve-env.outputs.tf_state_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ needs.resolve-env.outputs.tf_dir }}

      - name: Terraform Apply
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        run: terraform apply -auto-approve tfplan

  # ── Build & Push Backend Image ──────────────────────────────
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [resolve-env, terraform-apply]
    if: github.event_name == 'push'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push backend image
        id: build
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            >> "$GITHUB_OUTPUT"

  # ── Run Alembic Migrations ──────────────────────────────────
  run-migrations:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [resolve-env, build-backend]
    if: github.event_name == 'push'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Alembic migration ECS task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --task-definition "${{ secrets.MIGRATION_TASK_DEFINITION }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={
              subnets=[${{ secrets.ECS_PRIVATE_SUBNET_IDS }}],
              securityGroups=[${{ secrets.ECS_TASK_SG_ID }}],
              assignPublicIp=DISABLED
            }" \
            --overrides "{
              \"containerOverrides\": [{
                \"name\": \"migration\",
                \"environment\": [{
                  \"name\": \"IMAGE_TAG\",
                  \"value\": \"${{ github.sha }}\"
                }]
              }]
            }" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task ARN: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ] || exit 1

  # ── Deploy to ECS ───────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    needs: [resolve-env, run-migrations]
    if: github.event_name == 'push'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service with new image tag
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --service "${{ secrets.ECS_SERVICE_NAME }}" \
            --force-new-deployment

      - name: Wait for ECS service to stabilise
        timeout-minutes: 20
        run: |
          CLUSTER="${{ secrets.ECS_CLUSTER_NAME }}"
          SERVICE="${{ secrets.ECS_SERVICE_NAME }}"
          DEADLINE=$(( $(date +%s) + 1200 ))

          until [ $(date +%s) -ge $DEADLINE ]; do
            DEPLOYMENTS=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].deployments' \
              --output json)

            COUNT=$(echo "$DEPLOYMENTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))")
            STATUS=$(echo "$DEPLOYMENTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['rolloutState'])")

            echo "Deployments in progress: $COUNT  rolloutState: $STATUS"

            if [ "$COUNT" -eq 1 ] && [ "$STATUS" = "COMPLETED" ]; then
              echo "Service is stable."
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "Deployment rollout FAILED."
              exit 1
            fi

            sleep 15
          done

          echo "Timed out waiting for service to stabilise."
          exit 1

  # ── Build & Deploy Flutter Web ──────────────────────────────
  deploy-frontend:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    needs: [resolve-env]
    if: github.event_name == 'push'
    environment: ${{ needs.resolve-env.outputs.env_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: flutter pub get

      - name: Build Flutter web
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          flutter build web \
            --release \
            --base-href /

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Flutter build to S3
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          aws s3 sync build/web/ \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "flutter_service_worker.js" \
            --exclude "manifest.json"

          aws s3 cp build/web/index.html \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp build/web/flutter_service_worker.js \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/flutter_service_worker.js" \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp build/web/manifest.json \
            "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/manifest.json" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
